<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trí tuệ từ dữ liệu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Trợ lý AI Tùy Chỉnh</h1>
        </header>

        <div id="khung-chat" class="khung-chat">
            <div class="tin-nhan ai">
                <div class="noi-dung">Xin chào! Hãy gửi câu hỏi, tôi sẽ trả lời dựa trên dữ liệu bạn đã nạp.</div>
            </div>
        </div>

        <form id="form-nhap" class="khu-vuc-nhap">
            <input type="text" id="o-nhap" placeholder="Nhập câu hỏi của bạn..." autocomplete="off">
            <button type="submit">Gửi</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
